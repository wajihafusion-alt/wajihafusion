<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f3fb"><title>Reset Password | Wajiha Fusion</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=20261126-forgotpass1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{min-height:100vh;display:grid;place-items:center;padding:22px;background:var(--black,#f4f3fb);font-family:'DM Sans','Hind Siliguri',sans-serif}
.reset-card{width:min(100%,440px);padding:30px 24px;border:1px solid var(--line,#e2d2bd);border-radius:22px;background:var(--panel,#fff);box-shadow:0 18px 55px rgba(40,20,35,.1)}
.reset-brand{text-align:center;font-weight:800;letter-spacing:3px;color:var(--gold2,#800020)}.reset-card h1{margin:18px 0 8px;text-align:center;font-size:25px}.reset-copy{text-align:center;color:#777;line-height:1.6;margin-bottom:22px}
.reset-card label{display:block;margin:14px 0;font-weight:700}.reset-card input{display:block;width:100%;margin-top:7px;padding:13px;border:1px solid var(--line,#ddd);border-radius:10px;font:inherit}
.reset-card button{width:100%;margin-top:12px}.reset-message{min-height:28px;margin:14px 0 0;text-align:center;line-height:1.6;color:var(--gold2,#800020)}
</style></head>
<body><main class="reset-card">
<div class="reset-brand">WAJIHA FUSION</div><h1>নতুন Password সেট করুন</h1>
<p class="reset-copy">আপনার Account-এর জন্য একটি নতুন নিরাপদ Password লিখুন।</p>
<form id="resetForm">
<label>নতুন Password<input id="newPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="কমপক্ষে ৮ অক্ষর"></label>
<label>Password নিশ্চিত করুন<input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="আবার Password লিখুন"></label>
<button id="savePassword" class="gold-btn full" type="submit">SAVE NEW PASSWORD</button>
</form><p id="resetMessage" class="reset-message" role="status" aria-live="polite">Reset Link থেকে এখানে এলে নতুন Password সেট করতে পারবেন।</p>
<a href="index.html" style="display:block;text-align:center;margin-top:14px;color:var(--gold2,#800020)">← Login পেজে ফিরে যান</a>
</main>
<script src="config.js"></script>
<script>
(()=>{const cfg=window.WAJIHA_CONFIG||{},client=window.supabase?.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const form=document.getElementById('resetForm'),msg=document.getElementById('resetMessage'),btn=document.getElementById('savePassword');let recoveryReady=false;
async function init(){if(!client?.auth){msg.textContent='Account service সংযুক্ত নেই।';btn.disabled=true;return}
const hash=new URLSearchParams(location.hash.slice(1));const type=hash.get('type');
if(type==='recovery'&&hash.get('access_token')){const {error}=await client.auth.setSession({access_token:hash.get('access_token'),refresh_token:hash.get('refresh_token')||''});if(error){msg.textContent='Reset Link মেয়াদ শেষ বা Invalid হয়েছে। নতুন Reset Link নিন।';btn.disabled=true;return}}
const {data,error}=await client.auth.getSession();recoveryReady=!error&&!!data.session;
if(!recoveryReady){msg.textContent='Valid Password Reset Session পাওয়া যায়নি। Login পেজ থেকে আবার Forgot Password চাপুন।';btn.disabled=true}else{msg.textContent='নতুন Password সেট করুন।'}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!recoveryReady)return;const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){msg.textContent='Password কমপক্ষে ৮ অক্ষরের হতে হবে।';return}if(p!==c){msg.textContent='দুটি Password মিলছে না।';return}btn.disabled=true;msg.textContent='Password Update হচ্ছে...';try{const {error}=await client.auth.updateUser({password:p});if(error)throw error;msg.textContent='Password সফলভাবে পরিবর্তন হয়েছে। এখন নতুন Password দিয়ে Login করুন।';form.reset();await client.auth.signOut({scope:'local'});recoveryReady=false;btn.disabled=true}catch(err){msg.textContent=err.message||'Password পরিবর্তন করা যায়নি। Reset Link নতুন করে নিন।';btn.disabled=false}});
init();
})();
</script></body></html>
